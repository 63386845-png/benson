<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>国然教育夏令营发售交付页</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #657085;
      --paper: #fbfaf6;
      --white: #ffffff;
      --line: #dfe4ec;
      --navy: #203a5f;
      --gold: #c88b2f;
      --green: #2f8069;
      --shadow: 0 16px 45px rgba(23, 32, 51, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(18, 31, 50, 0.92), rgba(32, 58, 95, 0.7), rgba(32, 58, 95, 0.18)),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=82") center/cover fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: rgba(255, 255, 255, 0.88);
      font-weight: 900;
      margin-bottom: 72px;
    }

    .mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, var(--gold), var(--green));
    }

    .hero {
      max-width: 820px;
      color: #fff;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      color: #f3d79f;
      font-size: 14px;
      font-weight: 900;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 2px;
      background: #f3d79f;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 78px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .hero p {
      max-width: 680px;
      margin: 22px 0 0;
      color: rgba(255, 255, 255, 0.82);
      font-size: 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 42px;
    }

    .card {
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.2);
    }

    .card small {
      color: #f3d79f;
      font-weight: 900;
    }

    .card h2 {
      margin: 14px 0 10px;
      font-size: 30px;
      line-height: 1.18;
    }

    .card p {
      margin: 0;
      color: rgba(255, 255, 255, 0.78);
    }

    .action {
      margin-top: 24px;
      color: #fff;
      font-weight: 900;
    }

    @media (max-width: 760px) {
      main {
        width: min(100% - 28px, 1120px);
        padding: 36px 0;
      }

      .brand {
        margin-bottom: 52px;
      }

      h1 {
        font-size: 40px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">国</span><span>国然教育专属交付页</span></div>
    <section class="hero">
      <div class="eyebrow">2026 暑期夏令营发售项目</div>
      <h1>发售方案与 30 天陪跑路线图</h1>
      <p>这里仅汇总国然教育本次夏令营发售项目的核心方案页与执行看板，方便团队统一节奏、客户查看进展、后续复盘沉淀。</p>
    </section>

    <section class="cards" aria-label="交付物入口">
      <a class="card" href="./guoran-summer-camp-launch-page.html">
        <div>
          <small>交付物 01</small>
          <h2>夏令营增长发售方案</h2>
          <p>包含发售目标、整体节奏、双营产品定位、内部发售、外部公开课和执行检查点。</p>
        </div>
        <div class="action">打开方案页</div>
      </a>

      <a class="card" href="./guoran-30-day-roadmap.html">
        <div>
          <small>交付物 02</small>
          <h2>30 天陪跑执行路线图</h2>
          <p>包含每日任务、阶段筛选、任务详情、完成进度、关键验收节点和交付资产清单。</p>
        </div>
        <div class="action">打开路线图</div>
      </a>

    </section>
  </main>
</body>
</html>
